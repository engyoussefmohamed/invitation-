<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Youssef & Amira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tajawal:wght@300;400;500&display=swap" as="style" onload="this.rel='stylesheet'">
<noscript><link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Tajawal:wght@300;400;500&display=swap" rel="stylesheet"></noscript>
<style>
  :root {
    --cream: #f5efe4;
    --warm: #e8dcc8;
    --gold: #b8966a;
    --gold-light: #d4b483;
    --gold-dark: #8b6a3e;
    --olive: #6b7a3e;
    --text-dark: #3a2e1e;
    --text-mid: #6b5740;
    --pink: #e8b4b8;
    --pink-deep: #c4848a;
    --blush: #f2dada;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Tajawal', sans-serif;
    background: var(--cream);
    color: var(--text-dark);
    overflow-x: hidden;
  }

  /* ========== SCROLL CONTAINER ========== */
  .invitation {
    max-width: 430px;
    width: 100%;
    margin: 0 auto;
    background: var(--cream);
    min-height: 100vh;
    position: relative;
    overflow: hidden;
  }

  /* ========== SECTION 1 - HERO ========== */
  .hero {
    min-height: 100vh;
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 60px;
    background: url('Walpaber.png') center/cover no-repeat;
    overflow: hidden;
  }

  .hero::before {
    content: none;
  }

  .ring-photo-section {
    padding: 20px 0 0;
    background: transparent;
    display: flex;
    justify-content: center;
  }
  .ring-photo {
    width: 100%;
    display: flex;
    justify-content: center;
  }
  .ring-photo img {
    width: 100%;
    max-width: 420px;
    border-radius: 24px;
    box-shadow: 0 12px 30px rgba(0,0,0,0.15);
  }

  /* Floral corners */
  .floral-tl, .floral-tr, .floral-bl, .floral-br {
    position: absolute;
    width: 130px;
    height: 130px;
    opacity: 0.85;
    pointer-events: none;
  }
  .floral-tl { top: -10px; left: -10px; transform: rotate(0deg); }
  .floral-tr { top: -10px; right: -10px; transform: scaleX(-1); }
  .floral-bl { bottom: 80px; left: -10px; transform: scaleY(-1); }
  .floral-br { bottom: 80px; right: -10px; transform: scale(-1,-1); }

  .floral-svg { width: 100%; height: 100%; }

  .hero-content {
    position: relative;
    z-index: 2;
    text-align: center;
    animation: fadeUp 1.2s ease both;
    width: 100%;
    max-width: 460px;
    padding: 42px 30px;
    background: transparent;
    border-radius: 28px;
    box-shadow: 0 24px 50px rgba(0,0,0,0.18);
    margin: 0 auto;
    overflow: hidden;
  }

  #petals-canvas {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 999;
  }

  .bismillah {
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    color: var(--gold);
    letter-spacing: 0.1em;
    margin-bottom: 24px;
    opacity: 0;
    animation: fadeUp 1s ease 0.3s both;
  }

  .groom-name {
    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    color: var(--text-dark);
    line-height: 1;
    opacity: 0;
    animation: fadeUp 1s ease 0.5s both;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  }

  .ampersand {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 2rem;
    color: var(--gold);
    display: block;
    margin: 8px 0;
    opacity: 0;
    animation: fadeUp 1s ease 0.7s both;
  }

  .bride-name {
    font-family: 'Great Vibes', cursive;
    font-size: 4rem;
    color: var(--text-dark);
    line-height: 1;
    opacity: 0;
    animation: fadeUp 1s ease 0.9s both;
    text-shadow: 1px 1px 0 rgba(255,255,255,0.5);
  }

  .gold-divider {
    margin: 24px auto;
    width: 120px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    position: relative;
    opacity: 0;
    animation: fadeUp 1s ease 1.1s both;
  }
  .gold-divider::before {
    content: '❧';
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: var(--gold);
    font-size: 1rem;
    background: var(--cream);
    padding: 0 8px;
  }

  .date-text {
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    color: var(--pink-deep);
    direction: rtl;
    letter-spacing: 0.05em;
    opacity: 0;
    animation: fadeUp 1s ease 1.3s both;
  }

  /* Gazebo illustration */
  .gazebo-wrap {
    position: absolute;
    bottom: -10px;
    left: 50%;
    transform: translateX(-50%);
    width: 300px;
    opacity: 0;
    animation: fadeUp 1.2s ease 1.5s both;
  }

  /* reduce heavy visuals on small screens */
  @media (max-width: 360px) {
    .floral-tl, .floral-tr, .floral-bl, .floral-br { display: none; }
    .gazebo-wrap { width: 220px; bottom: -20px; }
    .hero { padding: 28px 12px 40px; }
    .gold-divider { width: 90px; }
    .calendar-date { font-size: 5.5rem; }
  }

  @media (max-width: 320px) {
    .groom-name, .bride-name { font-size: 2.8rem; }
    .calendar-date { font-size: 4.6rem; }
    .countdown-grid {
      gap: 8px;
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }
    .countdown-item {
      padding: 12px 10px;
    }
    .countdown-number {
      font-size: 2.2rem;
      min-width: 56px;
    }
  }

  /* ========== SECTION 2 - RINGS ========== */
  .section-rings {
    padding: 60px 30px;
    background: #faf6ef;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    position: relative;
    border-top: 1px solid #e8dcc8;
  }

  .rings-container {
    width: 180px;
    height: 140px;
    position: relative;
    margin-bottom: 30px;
    animation: float 3s ease-in-out infinite;
  }

  .ring {
    position: absolute;
    width: 90px;
    height: 90px;
    border-radius: 50%;
    border: 8px solid #c8b89a;
    background: radial-gradient(circle at 35% 35%, #e8d8c0, #c8a870, #8b6430);
  }
  .ring::after {
    content: '♡';
    position: absolute;
    bottom: 18px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 0.8rem;
    color: rgba(255,255,255,0.6);
  }

  .ring-left {
    left: 15px;
    top: 20px;
    transform: rotate(-15deg);
    box-shadow: -3px 3px 12px rgba(0,0,0,0.15);
  }
  .ring-right {
    right: 15px;
    top: 20px;
    transform: rotate(15deg);
    box-shadow: 3px 3px 12px rgba(0,0,0,0.15);
  }

  /* Shine lines on rings */
  .ring-sparkle {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 60px;
    height: 30px;
  }
  .ring-sparkle::before, .ring-sparkle::after {
    content: '';
    position: absolute;
    background: var(--gold);
    border-radius: 2px;
    animation: sparkle 1.5s ease-in-out infinite;
  }
  .ring-sparkle::before {
    width: 2px; height: 15px;
    top: 0; left: 10px;
    transform: rotate(-20deg);
  }
  .ring-sparkle::after {
    width: 2px; height: 15px;
    top: 0; right: 10px;
    transform: rotate(20deg);
  }

  .couple-subtitle {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.4rem;
    color: var(--text-mid);
    font-style: italic;
    margin-bottom: 6px;
  }
  .couple-names-small {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: var(--text-dark);
    font-weight: 400;
    letter-spacing: 0.05em;
  }
  .couple-names-small span {
    color: var(--gold);
    font-style: italic;
  }

  /* ========== SECTION 3 - CALENDAR ========== */
  .section-calendar {
    padding: 20px 24px 42px;
    background: linear-gradient(180deg, rgba(245,239,228,0.8) 0%, rgba(245,239,228,0.95) 100%);
  }

  .venue-label {
    text-align: center;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    color: var(--gold-dark);
    margin-bottom: 14px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
  }

  .venue-link-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    margin-bottom: 18px;
  }

  .venue-side-icon {
    width: 60px;
    height: 60px;
    object-fit: contain;
    display: block;
  }

  .notice-bar {
    margin: 20px auto 16px;
    padding: 12px 20px;
    background: rgba(184, 150, 106, 0.12);
    border: 1px solid rgba(184, 150, 106, 0.25);
    border-radius: 999px;
    overflow: hidden;
    position: relative;
  }

  .notice-bar span {
    display: inline-block;
    white-space: nowrap;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    color: var(--gold-dark);
    animation: marquee 16s linear infinite;
  }

  @keyframes marquee {
    0% { transform: translateX(-100%); }
    100% { transform: translateX(100%); }
  }

  .venue-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: rgba(184, 150, 106, 0.12);
    color: var(--gold-dark);
    border: 1px solid rgba(184, 150, 106, 0.4);
    border-radius: 999px;
    padding: 10px 18px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    text-decoration: none;
    transition: background 0.25s, transform 0.25s;
  }

  .venue-link:hover,
  .venue-link:focus-visible {
    background: rgba(184, 150, 106, 0.22);
    transform: translateY(-1px);
  }

  .calendar-card {
    background: #fff9f0;
    border-radius: 32px;
    overflow: hidden;
    box-shadow: 0 18px 60px rgba(0,0,0,0.08);
    position: relative;
    border: 1px solid rgba(184, 150, 106, 0.24);
  }

  .calendar-header {
    background: linear-gradient(90deg, rgba(184,150,106,0.95), rgba(156,124,88,0.95));
    color: #fffdf9;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 18px 24px;
    font-family: 'Tajawal', sans-serif;
    gap: 12px;
    direction: ltr;
  }
  .calendar-header .day-label,
  .calendar-header .year-label {
    font-size: 0.85rem;
    opacity: 0.88;
    color: rgba(255,255,255,0.9);
  }
  .calendar-header .month-label {
    font-size: 1.05rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: #fff;
  }

  .calendar-rings-top {
    display: flex;
    justify-content: center;
    gap: 14px;
    padding: 0 24px;
    position: relative;
    top: -10px;
  }
  .cal-ring {
    width: 14px;
    height: 19px;
    border: 1px solid rgba(184, 150, 106, 0.5);
    border-radius: 6px;
    background: rgba(255, 250, 244, 0.95);
  }

  .calendar-body {
    padding: 24px 28px 34px;
    text-align: center;
    background: linear-gradient(180deg, #fffaf1 0%, #f2e7d8 100%);
  }

  .calendar-date {
    font-size: 8.5rem;
    font-weight: 700;
    color: var(--gold-dark);
    line-height: 0.9;
    font-family: 'Cormorant Garamond', serif;
    animation: pulse-date 2s ease-in-out infinite;
    text-shadow: 0 2px 0 rgba(255,255,255,0.95);
  }

  .calendar-day-ar {
    font-family: 'Tajawal', sans-serif;
    font-size: 1rem;
    color: var(--pink-deep);
    margin-top: 10px;
  }

  .calendar-time {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.35rem;
    color: var(--text-mid);
    margin-top: 6px;
    font-style: italic;
  }

  .calendar-actions {
    display: grid;
    gap: 12px;
    margin-top: 24px;
  }

  .save-date-btn {
    width: 100%;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    background: var(--gold);
    border: none;
    color: white;
    border-radius: 999px;
    padding: 12px 24px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    transition: all 0.25s ease;
  }
  .save-date-btn:hover,
  .save-date-btn:focus-visible {
    background: #d4b483;
    transform: translateY(-1px);
  }

  /* ========== SECTION 4 - COUNTDOWN ========== */
  .section-countdown {
    padding: 42px 26px;
    background: linear-gradient(180deg, rgba(245,239,228,0.98) 0%, rgba(232,220,200,0.95) 100%);
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .section-countdown::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top center, rgba(255,255,255,0.55), transparent 42%);
    pointer-events: none;
  }

  .countdown-label {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1rem;
    color: var(--olive);
    margin-bottom: 22px;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
  }

  .countdown-grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(72px, 1fr));
    gap: 14px;
    direction: rtl;
    position: relative;
    z-index: 1;
  }

  .countdown-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 16px 12px;
    background: rgba(255,255,255,0.9);
    border-radius: 24px;
    border: 1px solid rgba(184,150,106,0.18);
    box-shadow: 0 14px 30px rgba(0,0,0,0.06);
  }

  .countdown-number {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.6rem;
    font-weight: 700;
    color: var(--olive);
    line-height: 1;
    min-width: 68px;
    text-align: center;
    background: radial-gradient(circle at 30% 20%, #ffffff, #f8f0de);
    border-radius: 18px;
    padding: 14px 10px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.85), 0 6px 14px rgba(0,0,0,0.08);
    transition: transform 0.3s ease;
  }

  .countdown-number:hover,
  .countdown-item:hover .countdown-number {
    transform: translateY(-2px);
  }

  .countdown-unit {
    font-family: 'Tajawal', sans-serif;
    font-size: 0.8rem;
    color: var(--text-mid);
    letter-spacing: 0.05em;
  }

  /* ========== SECTION 5 - FOOTER ========== */
  .section-footer {
    padding: 56px 24px 64px;
    text-align: center;
    background: linear-gradient(180deg, rgba(231, 199, 148, 0.16) 0%, rgba(255, 251, 244, 0.98) 100%);
    position: relative;
    overflow: hidden;
    border-top: 1px solid rgba(184,150,106,0.22);
  }

  .section-footer::before {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(circle at top right, rgba(255,255,255,0.6), transparent 30%), radial-gradient(circle at bottom left, rgba(232,220,200,0.35), transparent 35%);
    pointer-events: none;
  }

  .footer-content { position: relative; z-index: 1; max-width: 420px; margin: 0 auto; }

  .footer-quote {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.05rem;
    color: var(--text-mid);
    line-height: 1.95;
    margin: 0 auto 22px;
    font-weight: 300;
    max-width: 320px;
  }

  .footer-names {
    font-family: 'Great Vibes', cursive;
    font-size: 3rem;
    color: var(--gold-dark);
    margin-bottom: 10px;
    display: none;
  }

  .footer-name-image {
    width: 100%;
    max-width: 280px;
    display: block;
    margin: 0 auto 10px;
    object-fit: contain;
  }

  .footer-meta {
    font-family: 'Tajawal', sans-serif;
    font-size: 0.88rem;
    color: var(--gold-dark);
    letter-spacing: 0.08em;
    margin-top: 12px;
    opacity: 0.85;
  }

  .footer-divider {
    margin: 18px auto;
    display: flex;
    align-items: center;
    gap: 10px;
    justify-content: center;
  }
  .footer-divider::before, .footer-divider::after {
    content: '';
    height: 1px;
    width: 54px;
    background: var(--gold);
  }
  .footer-divider span { color: var(--gold); font-size: 1.15rem; }

  /* ========== ANIMATIONS ========== */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(30px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes sparkle {
    0%, 100% { opacity: 1; transform: scaleY(1) rotate(-20deg); }
    50% { opacity: 0.3; transform: scaleY(0.5) rotate(-20deg); }
  }

  @keyframes pulse-date {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.02); }
  }

  /* Scroll reveal */
  .reveal {
    opacity: 0;
    transform: translateY(40px);
    transition: opacity 0.8s ease, transform 0.8s ease;
  }
  .reveal.visible {
    opacity: 1;
    transform: translateY(0);
  }

  /* Mobile responsive */
  @media (max-width: 400px) {
    .groom-name, .bride-name { font-size: 3.2rem; }
    .countdown-number { font-size: 2.2rem; min-width: 52px; }
  }

  /* Skip link for keyboard users */
  .skip-link {
    position: absolute;
    left: 0;
    top: -40px;
    background: #000;
    color: #fff;
    padding: 8px 12px;
    z-index: 9999;
    transition: top 0.2s ease;
  }
  .skip-link:focus { top: 6px; }

  .music-toggle {
    display: none;
    position: fixed;
    bottom: 18px;
    right: 18px;
    z-index: 10001;
    background: rgba(184, 150, 106, 0.95);
    color: #fff;
    border: none;
    border-radius: 999px;
    padding: 12px 18px;
    font-family: 'Tajawal', sans-serif;
    font-size: 0.95rem;
    cursor: pointer;
    box-shadow: 0 12px 24px rgba(0,0,0,0.18);
  }
  .music-toggle:hover,
  .music-toggle:focus-visible {
    background: #d4b483;
  }

  /* RSVP modal */
  .modal {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    background: rgba(0,0,0,0.5);
    z-index: 10000;
    padding: 20px;
  }
  .modal-content {
    background: white;
    border-radius: 10px;
    padding: 18px;
    max-width: 420px;
    width: 100%;
    direction: rtl;
    color: var(--text-dark);
  }
  .modal.hidden { display: none; }
  .modal h3 { margin-bottom: 8px; font-family: 'Tajawal'; }
  .modal input, .modal textarea, .modal select { width: 100%; margin-bottom: 8px; padding: 8px; border-radius: 6px; border: 1px solid #ddd; font-family: 'Tajawal'; }
  .modal .actions { display:flex; gap:8px; justify-content:flex-end; }

  /* Print adjustments */
  @media print {
    body { background: #fff; color: #000; }
    .floral-tl, .floral-tr, .floral-bl, .floral-br, .gazebo-wrap, .ring-sparkle { display: none !important; }
    .save-date-btn, button { display: none !important; }
    .invitation { box-shadow: none; }
  }

  /* Respect reduced motion preference */
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <audio id="background-music" src="song.mpeg" autoplay loop preload="auto" playsinline></audio>
  <button id="music-toggle" class="music-toggle" type="button">تشغيل الموسيقى</button>
  <canvas id="petals-canvas" aria-hidden="true"></canvas>
  <a href="#main" class="skip-link">تخطي إلى المحتوى</a>
<div id="main" class="invitation">

  <!-- ===== SECTION 1: HERO ===== -->
  <section class="hero">
  

  

    
  </section>

  <section class="ring-photo-section reveal" aria-label="صورة الخاتم">

  </section>


  <!-- ===== SECTION 3: CALENDAR ===== -->
  <section class="section-calendar reveal">
    <div class="calendar-card">
      <div class="calendar-header">
        <span class="day-label">Friday</span>
        <span class="month-label">may</span>
        <span class="year-label">2026</span>
      </div>
      <div class="calendar-rings-top">
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
        <div class="cal-ring"></div>
      </div>
      <div class="calendar-body">
        <div class="calendar-date">29</div>
        <div class="calendar-actions">

        </div>
      </div>
    </div>
    <div class="notice-bar" aria-hidden="true">

<script>
  // ===== FALLING PETALS =====
  (function () {
    const canvas = document.getElementById('petals-canvas');
    const ctx = canvas.getContext('2d');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    resize();
    window.addEventListener('resize', resize);

    const COLORS = [
      'rgba(240, 185, 190, VAL)',
      'rgba(232, 160, 168, VAL)',
      'rgba(248, 210, 215, VAL)',
      'rgba(210, 170, 160, VAL)',
      'rgba(255, 220, 200, VAL)',
    ];

    const TOTAL = 28;
    const petals = [];

    function randomBetween(a, b) {
      return a + Math.random() * (b - a);
    }

    function createPetal(fromTop) {
      const size = randomBetween(10, 22);
      return {
        x: randomBetween(0, canvas.width),
        y: fromTop ? randomBetween(-200, -10) : randomBetween(0, canvas.height),
        size,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        opacity: randomBetween(0.35, 0.75),
        speedY: randomBetween(0.5, 1.4),
        speedX: randomBetween(-0.4, 0.4),
        rotation: randomBetween(0, Math.PI * 2),
        rotSpeed: randomBetween(-0.012, 0.012),
        wobble: randomBetween(0, Math.PI * 2),
        wobbleSpeed: randomBetween(0.01, 0.025),
      };
    }

    for (let i = 0; i < TOTAL; i++) {
      petals.push(createPetal(false));
    }

    function drawPetal(p) {
      const col = p.color.replace('VAL', p.opacity.toFixed(2));
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rotation);

      const flutter = 0.4 + 0.6 * Math.abs(Math.sin(p.wobble));
      ctx.scale(flutter, 1);

      ctx.beginPath();
      ctx.ellipse(0, 0, p.size * 0.45, p.size * 0.9, 0, 0, Math.PI * 2);

      const grad = ctx.createRadialGradient(0, -p.size * 0.3, 0, 0, 0, p.size);
      const baseCol = p.color.replace('VAL', (p.opacity * 0.9).toFixed(2));
      const edgeCol = p.color.replace('VAL', (p.opacity * 0.3).toFixed(2));
      grad.addColorStop(0, baseCol);
      grad.addColorStop(1, edgeCol);

      ctx.fillStyle = grad;
      ctx.fill();
      ctx.restore();
    }

    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      for (const p of petals) {
        p.wobble += p.wobbleSpeed;
        p.y += p.speedY;
        p.x += p.speedX + Math.sin(p.wobble) * 0.5;
        p.rotation += p.rotSpeed;

        if (p.y > canvas.height + 30) {
          Object.assign(p, createPetal(true));
        }
        if (p.x > canvas.width + 30) p.x = -30;
        if (p.x < -30) p.x = canvas.width + 30;

        drawPetal(p);
      }

      requestAnimationFrame(animate);
    }

    animate();
  })();

  // ===== COUNTDOWN TIMER =====
  function updateCountdown() {
    const weddingDate = new Date('2026-05-29T19:30:00');
    const now = new Date();
    const diff = weddingDate - now;

    if (diff <= 0) {
      document.getElementById('days').textContent = '00';
      document.getElementById('hours').textContent = '00';
      document.getElementById('minutes').textContent = '00';
      document.getElementById('seconds').textContent = '00';
      return;
    }

    const days    = Math.floor(diff / (1000 * 60 * 60 * 24));
    const hours   = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((diff % (1000 * 60)) / 1000);

    document.getElementById('days').textContent    = String(days).padStart(2, '0');
    document.getElementById('hours').textContent   = String(hours).padStart(2, '0');
    document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
    document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);

  // ===== SCROLL REVEAL =====
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if (entry.isIntersecting) {
        entry.target.classList.add('visible');
      }
    });
  }, { threshold: 0.15 });

  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  // Optionally expose export for admins via console: call exportRsvps()

  const backgroundMusic = document.getElementById('background-music');
  const musicToggle = document.getElementById('music-toggle');

  function showMusicButton() {
    if (musicToggle) {
      musicToggle.style.display = 'inline-flex';
    }
  }

  function startMusic() {
    if (!backgroundMusic) return;
    const playPromise = backgroundMusic.play();
    if (playPromise !== undefined) {
      playPromise.catch(() => {
        showMusicButton();
        document.body.addEventListener('click', onFirstInteraction, { once: true });
      });
    }
  }

  function onFirstInteraction() {
    if (!backgroundMusic) return;
    backgroundMusic.play().catch(() => {
      showMusicButton();
    });
  }

  if (musicToggle) {
    musicToggle.addEventListener('click', () => {
      if (!backgroundMusic) return;
      backgroundMusic.play().catch(() => {
        /* ignore */
      });
      musicToggle.style.display = 'none';
    });
  }

  startMusic();
</script>
